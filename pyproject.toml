[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-parser"
version = "0.1.0"
description = "Document ingestion and canonical parsing for RAG"
requires-python = ">=3.10,<3.14"
dependencies = ["pymupdf>=1.24,<2", "openpyxl>=3.1,<4", "pydantic>=2,<3", "pillow>=10"]

[project.optional-dependencies]
docx = ["docling-slim[format-docx]>=2.133,<3"]
ocr = [
    "paddleocr[doc-parser]>=3.7,<4",
    "paddlepaddle>=3.3,<4",
    "huggingface-hub>=0.25,<2",
]
rag = [
    "numpy>=1.26",
    "qdrant-client>=1.9,<2",
    "sentence-transformers>=2.7",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "streamlit>=1.33",
]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: real document parsing", "slow: model inference"]
