[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-parser"
version = "0.1.0"
description = "Document ingestion and canonical parsing for RAG"
readme = "docs/README.md"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Choose one Paddle backend; both distributions provide the same paddle module.
cpu = ["paddlepaddle==3.3.0"]
gpu = ["paddlepaddle-gpu==3.3.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_parser = ["config.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: real document parsing", "slow: model inference"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
