[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-parser"
version = "0.1.0"
description = "Document ingestion and canonical parsing for RAG"
readme = "docs/README.md"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Choose one Paddle backend; both distributions provide the same paddle module.
cpu = ["paddlepaddle==3.3.0"]
gpu = ["paddlepaddle-gpu==3.3.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
docx = ["docling-slim[format-docx]>=2.133,<3"]
ocr = [
    "paddleocr[doc-parser]>=3.7,<4",
    "paddlepaddle>=3.3,<4",
    "huggingface-hub>=0.25,<2",
]
rag = [
    "numpy>=1.26",
    "qdrant-client>=1.9,<2",
    "FlagEmbedding>=1.3.5,<2",
    "transformers>=4.45,<5",
    "httpx>=0.27,<1",
    "pillow>=10",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "streamlit>=1.33",
]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_parser = ["config.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: real document parsing", "slow: model inference"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
